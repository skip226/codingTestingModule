name: TestForge Lite Android

on:
  push:
    branches: [feat/testforge-android-lite]
    paths:
      - "android-lite/**"
      - ".github/workflows/android-lite.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build debug APK
        run: gradle -p android-lite assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: testforge-lite-debug-apk
          path: android-lite/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

name: Publish TestForge Lite v1.1.0

on:
  push:
    branches: [feat/testforge-android-lite]
    paths:
      - ".github/workflows/android-lite-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build APK
        run: gradle -p android-lite assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp android-lite/app/build/outputs/apk/debug/app-debug.apk TestForge-Lite-v1.1.0.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create testforge-lite-v1.1.0 \
            TestForge-Lite-v1.1.0.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "TestForge Lite v1.1.0" \
            --notes "Personal offline Android edition of TestForge. Includes PDF, DOCX, TXT and Markdown structured-test import; automatic grading; explanations; score history; overall grade; and local JSON backup/restore. No account, cloud service, subscription, or API is required."
